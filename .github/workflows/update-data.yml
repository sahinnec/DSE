name: Update DSE data

on:
  schedule:
    # DSE closes 14:30 Dhaka (08:30 UTC). Run 15:30 Dhaka = 09:30 UTC, Sun-Thu.
    - cron: "30 9 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch DSE data
        env:
          OUT: docs/data.json.new
          DEBUG_DIR: docs/debug
        run: python scripts/fetch_data.py
      - name: Sanity check, then replace data.json
        run: |
          python - <<'PY'
          import json, sys, os
          d = json.load(open("docs/data.json.new", encoding="utf-8"))
          n = len(d["rows"]); lv = d["meta"]["counts"].get("withLevels", 0)
          print("rows", n, "withLevels", lv, "warnings", d["meta"]["warnings"])
          if n < 20:
              sys.exit("Too few rows; keeping the previous data.json")
          os.replace("docs/data.json.new", "docs/data.json")
          PY
      - name: Commit
        run: |
          git config user.name "dse-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json docs/debug
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
